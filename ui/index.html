<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paperclip" />
    <title>Paperclip</title>
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const key = "paperclip.theme";
        const darkThemeColor = "#18181b";
        const lightThemeColor = "#ffffff";
        try {
          const stored = window.localStorage.getItem(key);
          const theme = stored === "light" || stored === "dark" ? stored : "dark";
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <script>
      (() => {
        const host = window.location.hostname;
        const isDevHost = host === "localhost" || host === "127.0.0.1" || host === "::1";
        if (!isDevHost) return;

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then((registrations) =>
              Promise.all(registrations.map((registration) => registration.unregister())),
            )
            .catch(() => {});
        }

        if ("caches" in window) {
          caches
            .keys()
            .then((keys) =>
              Promise.all(
                keys
                  .filter((key) => key.startsWith("paperclip-"))
                  .map((key) => caches.delete(key)),
              ),
            )
            .catch(() => {});
        }
      })();
    </script>
    <script>
      (() => {
        let shown = false;

        async function clearRecoverableLocalState() {
          if ("serviceWorker" in navigator) {
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
            } catch {}
          }

          if ("caches" in window) {
            try {
              const keys = await caches.keys();
              await Promise.all(
                keys
                  .filter((key) => key.startsWith("paperclip-"))
                  .map((key) => caches.delete(key)),
              );
            } catch {}
          }
        }

        function renderRecovery() {
          if (shown) return;
          shown = true;

          const mount = () => {
            const root = document.getElementById("root");
            if (!root || root.childElementCount > 0) return;
            root.innerHTML = `
              <main style="min-height:100vh;background:#18181b;color:#fafafa;padding:40px 16px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
                <section style="max-width:560px;margin:0 auto;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:#222226;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,.24)">
                  <h1 style="margin:0 0 12px;font-size:18px;line-height:1.4;font-weight:650">页面加载失败</h1>
                  <p style="margin:0;color:#c7c7d1;font-size:14px;line-height:1.7">浏览器可能仍在使用旧版本的前端资源。清理可恢复的本地缓存后刷新即可继续，服务端保存的模型配置不会被删除。</p>
                  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:20px">
                    <button id="paperclip-clear-reload" type="button" style="border:0;border-radius:6px;background:#fafafa;color:#18181b;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer">清理本地状态并刷新</button>
                    <button id="paperclip-direct-reload" type="button" style="border:1px solid rgba(255,255,255,.18);border-radius:6px;background:transparent;color:#fafafa;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer">直接刷新</button>
                  </div>
                </section>
              </main>
            `;
            document.getElementById("paperclip-clear-reload")?.addEventListener("click", async () => {
              await clearRecoverableLocalState();
              window.location.reload();
            });
            document.getElementById("paperclip-direct-reload")?.addEventListener("click", () => {
              window.location.reload();
            });
          };

          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", mount, { once: true });
          } else {
            mount();
          }
        }

        function isAppResourceUrl(value) {
          if (!value) return false;
          try {
            const url = new URL(value, window.location.href);
            return url.origin === window.location.origin
              && (url.pathname.startsWith("/assets/") || url.pathname === "/src/main.tsx");
          } catch {
            return false;
          }
        }

        window.addEventListener("error", (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement && isAppResourceUrl(target.src)) {
            renderRecovery();
          }
          if (target instanceof HTMLLinkElement && isAppResourceUrl(target.href)) {
            renderRecovery();
          }
        }, true);

        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason;
          const message = String(reason?.message ?? reason ?? "");
          if (/loading chunk|dynamically imported module|module script failed|failed to fetch/i.test(message)) {
            renderRecovery();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
